# Minab — Android CI for Minab Beta v0.4
#
# Builds the debug APK with GitHub Actions (no local SDK needed) and,
# when the v0.4 tag is pushed, publishes it as the "Minab Beta v0.4"
# release. The upstream ics-openvpn workflow (.github/workflows/build.yaml)
# is kept untouched and still runs; this workflow is the Minab one.
# (v0.3 used the same flow with tag v0.3 / "Minab Beta v0.3".)
#
# Signing: v0.4+ are all signed with ONE permanent keystore (RSA 2048,
# valid to 2056, alias "minab"), so they install over each other.
# The keystore itself lives OUTSIDE the repo; CI decodes it from the
# MINAB_KEYSTORE_BASE64_1/2/3 secrets (its base64, in three parts,
# is in ~/workspace/minab-keystore/minab-release.p12.b64 — one
# 3520-char paste arrived truncated, so it is stored in parts). If any signing
# secret is missing the build FAILS LOUDLY below instead of silently
# falling back to a fresh debug key — a fresh key per build was why
# v0.1–v0.3 could not install over each other. v0.4 itself needs a
# ONE-TIME uninstall of older betas, because its key differs from
# the old per-build debug keys. See README.md ("Signing").
name: Minab Android (Beta v0.4)

permissions:
  contents: write

on:
  push:
    branches: [minab-beta-0.1, minab-beta-0.2, minab-beta-0.3, minab-beta-0.4, master, main]
    tags: ["v0.4"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: "Build Minab Beta v0.4 (debug APK)"
    runs-on: ubuntu-24.04
    env:
      MINAB_KEYSTORE_BASE64_1: ${{ secrets.MINAB_KEYSTORE_BASE64_1 }}
      MINAB_KEYSTORE_BASE64_2: ${{ secrets.MINAB_KEYSTORE_BASE64_2 }}
      MINAB_KEYSTORE_BASE64_3: ${{ secrets.MINAB_KEYSTORE_BASE64_3 }}
      MINAB_KEYSTORE_BASE64: ${{ secrets.MINAB_KEYSTORE_BASE64 }}
      MINAB_KEYSTORE_PASSWORD: ${{ secrets.MINAB_KEYSTORE_PASSWORD }}
      MINAB_KEY_ALIAS: ${{ secrets.MINAB_KEY_ALIAS }}
      MINAB_KEY_PASSWORD: ${{ secrets.MINAB_KEY_PASSWORD }}
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Check Minab release keystore secrets
        run: |
          missing=""
          for v in MINAB_KEYSTORE_BASE64_1 MINAB_KEYSTORE_BASE64_2 MINAB_KEYSTORE_BASE64_3 MINAB_KEYSTORE_PASSWORD MINAB_KEY_ALIAS MINAB_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing Minab signing secrets:$missing — set them in the repo Settings > Secrets and variables > Actions (see README.md 'Signing'). Refusing to build with a fresh debug key, because that key would not install over previous versions."
            exit 1
          fi
          echo "All Minab signing secrets are present."
          # Only LENGTHS are printed (never values): the three parts
          # must be 1173 + 1173 + 1174 = 3520 chars. A single 3520-char
          # paste through the web UI arrived truncated (2322 chars),
          # so the keystore is stored in three parts instead.
          echo "MINAB_KEYSTORE_BASE64 part lengths: ${#MINAB_KEYSTORE_BASE64_1} + ${#MINAB_KEYSTORE_BASE64_2} + ${#MINAB_KEYSTORE_BASE64_3} (expected 1173 + 1173 + 1174 = 3520)"

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licences
        run: yes | sdkmanager --licenses || true

      - name: Build debug APK (UiOvpn23 flavour)
        run: ./gradlew assembleUiOvpn23Debug --stacktrace

      - name: List built APKs
        run: find main/build/outputs/apk -name '*.apk' -print

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: minab-beta-v0.4-debug-apk
          path: main/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release "Minab Beta v0.4"
        if: startsWith(github.ref, 'refs/tags/v0.4')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4
          name: Minab Beta v0.4
          draft: false
          prerelease: true
          files: main/build/outputs/apk/**/debug/*.apk
          body: |
            Minab Beta v0.4 — Android only, debug build signed with the permanent Minab key.

            OpenVPN client based on ics-openvpn (GPLv2, Arne Schwabe),
            with bulk import of many .ovpn files / a .zip, one username
            and password for all, profile groups (manual + automatic
            by country), and bulk ping test of all profiles or one
            group.

            New in v0.4:
            - Notification permission is asked at first launch; if
              declined, only a minimal one-line banner is shown.
            - Bulk import / Test ping buttons are full-size (48dp)
              with standard 24dp icons, no longer cut off.
            - Group tabs under the buttons: one tab per country group
              (automatic), a "+" tab to create a group, and a small
              ping icon next to each group name that pings just that
              group.
            - The connect button is ~20% smaller; the home screen
              stays minimal.
            - Tapping connect no longer auto-opens the log page — you
              stay on Home while connecting.
            - New CONFIGS tab (between Home and Graph): delete configs,
              change username/password for one group or for all,
              rename configs, and back up all configs to a zip.
            - New setting (on by default): show download/upload speed
              in the VPN notification after connecting.
            - The main tab bar moved to the bottom, smaller and more
              minimal. The first tab is now HOME.
            - New-version notice on Home, in Settings and in About
              (checks GitHub releases, cached 24 h).
            - One permanent signing key: from v0.4 onward every version
              installs over the previous one.
            - Home subtitle, About and FAQ now describe Minab.

            Install: download the APK below and install it on Android.
            ONE-TIME UNINSTALL NEEDED: v0.4 uses a new permanent
            signing key, so it cannot install over v0.1–v0.3 — uninstall
            the old beta once (profiles stored in the app will be lost,
            so keep your .ovpn files to re-import with Bulk import),
            then install v0.4. Later versions will install over v0.4
            normally.
