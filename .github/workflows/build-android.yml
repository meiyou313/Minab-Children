# Minab — Android CI for Minab Beta v0.6
#
# Builds the debug APK with GitHub Actions (no local SDK needed) and,
# when a v* tag is pushed, publishes it as the "Minab debug Beta
# <tag>" release (the tag name drives the release name and APK file
# name, so hotfix tags need no workflow change). The upstream
# ics-openvpn workflow (.github/workflows/build.yaml)
# is kept untouched and still runs; this workflow is the Minab one.
# (v0.5.1 used the same flow with tag v0.5.1 / "Minab debug Beta v0.5.1".)
#
# Signing: v0.4+ are all signed with ONE permanent keystore (RSA 2048,
# valid to 2056, alias "minab"), so they install over each other.
# The keystore itself lives OUTSIDE the repo; CI decodes it from the
# MINAB_KEYSTORE_BASE64_1/2/3 secrets (its base64, in three parts,
# is in ~/workspace/minab-keystore/minab-release.p12.b64 — one
# 3520-char paste arrived truncated, so it is stored in parts). If any signing
# secret is missing the build FAILS LOUDLY below instead of silently
# falling back to a fresh debug key — a fresh key per build was why
# v0.1–v0.3 could not install over each other. v0.4 itself needs a
# ONE-TIME uninstall of older betas, because its key differs from
# the old per-build debug keys. See README.md ("Signing").
name: Minab Android (Beta v0.6)

permissions:
  contents: write

on:
  push:
    branches: [minab-beta-0.1, minab-beta-0.2, minab-beta-0.3, minab-beta-0.4, minab-beta-0.5, minab-beta-0.5.1, minab-beta-0.6, master, main]
    tags: ["v0.5", "v0.5.1", "v0.6"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: "Build Minab Beta v0.6 (debug APK)"
    runs-on: ubuntu-24.04
    env:
      MINAB_KEYSTORE_BASE64_1: ${{ secrets.MINAB_KEYSTORE_BASE64_1 }}
      MINAB_KEYSTORE_BASE64_2: ${{ secrets.MINAB_KEYSTORE_BASE64_2 }}
      MINAB_KEYSTORE_BASE64_3: ${{ secrets.MINAB_KEYSTORE_BASE64_3 }}
      MINAB_KEYSTORE_BASE64: ${{ secrets.MINAB_KEYSTORE_BASE64 }}
      MINAB_KEYSTORE_PASSWORD: ${{ secrets.MINAB_KEYSTORE_PASSWORD }}
      MINAB_KEY_ALIAS: ${{ secrets.MINAB_KEY_ALIAS }}
      MINAB_KEY_PASSWORD: ${{ secrets.MINAB_KEY_PASSWORD }}
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Check Minab release keystore secrets
        run: |
          missing=""
          for v in MINAB_KEYSTORE_BASE64_1 MINAB_KEYSTORE_BASE64_2 MINAB_KEYSTORE_BASE64_3 MINAB_KEYSTORE_PASSWORD MINAB_KEY_ALIAS MINAB_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing Minab signing secrets:$missing — set them in the repo Settings > Secrets and variables > Actions (see README.md 'Signing'). Refusing to build with a fresh debug key, because that key would not install over previous versions."
            exit 1
          fi
          echo "All Minab signing secrets are present."
          # Only LENGTHS are printed (never values): the three parts
          # must be 1173 + 1173 + 1174 = 3520 chars. A single 3520-char
          # paste through the web UI arrived truncated (2322 chars),
          # so the keystore is stored in three parts instead.
          echo "MINAB_KEYSTORE_BASE64 part lengths: ${#MINAB_KEYSTORE_BASE64_1} + ${#MINAB_KEYSTORE_BASE64_2} + ${#MINAB_KEYSTORE_BASE64_3} (expected 1173 + 1173 + 1174 = 3520)"

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licences
        run: yes | sdkmanager --licenses || true

      - name: Build debug APK (UiOvpn23 flavour)
        run: ./gradlew assembleUiOvpn23Debug --stacktrace

      - name: List built APKs
        run: find main/build/outputs/apk -name '*.apk' -print

      # Minab Beta v0.6 — the release asset carries its version in
      # its name (Minab-debug-Beta-v0.6.apk), so releases are easy
      # to tell apart. The built file is copied, not moved, so the
      # stock name stays available too.
      - name: Rename APK with version
        run: |
          APK=$(find main/build/outputs/apk -name 'main-ui-ovpn23-debug.apk' | head -n 1)
          cp "$APK" "$(dirname "$APK")/Minab-debug-Beta-v0.6.apk"
          ls -l "$(dirname "$APK")"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: minab-beta-v0.6-debug-apk
          path: main/build/outputs/apk/**/debug/Minab-debug-Beta-v0.6.apk
          if-no-files-found: error

      # The release step is tag-driven: tag_name and the release
      # name come from the pushed tag (v0.6 -> "Minab debug Beta
      # v0.6"), so a hotfix tag needs no workflow change.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Minab debug Beta ${{ github.ref_name }}
          draft: false
          prerelease: true
          files: main/build/outputs/apk/**/debug/Minab-debug-Beta-v0.6.apk
          body: |
            Minab debug Beta v0.6 — Android only, debug build signed with the permanent Minab key.

            OpenVPN client based on ics-openvpn (GPLv2, Arne Schwabe),
            with bulk import of many .ovpn files / a .zip, one username
            and password for all, profile groups (manual + automatic
            by country), and bulk ping test of all profiles or one
            group.

            New in v0.6: Real test — the "Real test" button on Home
            actually connects each server in turn and fetches the
            Telegram web client (web.telegram.org) through the tunnel,
            so the result proves the server really bypasses filtering
            (a plain ping cannot prove that). It pings first when
            needed, tests fastest servers first, and stops as soon as
            3 servers have passed. Working servers show a "Real:
            <ms>" badge and sort first.

            v0.5.1 HOTFIX: v0.5 crashed on every launch (white screen,
            then the app closed). Cause: the new single-scroll Home
            asked ListFragment for its ListView while the fragment
            had no view yet (in onCreate), which throws. Fixed by
            posting the resize on the fragment's own view instead.
            Everything else is the same as v0.5.

            New in v0.5:
            - The repo is now "Minab Children"
              (github.com/meiyou313/Minab-Children); the app is still
              just "Minab".
            - Releases carry their version in the title and the APK
              file name ("Minab debug Beta v0.6").
            - FAQ moved out of the bottom tab bar to the end of
              Settings; the tab bar is smaller and each tab has a
              faint frame, so all five tabs fit without scrolling.
            - The home header shows a memorial line next to "Minab":
              "In memory of the 168 innocent children of Minab
              Elementary School, who took flight to heaven far too
              soon."
            - Action buttons and group tabs are smaller and more
              minimal; the group bar fades at the right edge so it
              is clear it scrolls; the first tab reads "all" and the
              "+" tab is last.
            - Config rows are minimal, with the country's flag before
              the name (36 most-used countries bundled, tiny
              vectors); the home list scrolls together with the whole
              home page now.
            - Configs tab: tick boxes to select configs and delete
              the selected ones, or share them as one zip file; the
              Share button also shares one group or all configs.
              The credentials buttons now explain that they set the
              VPN username/password the configs use to log in.
            - The top bar has add / bulk-import / settings icons on
              every tab, not only on Home.

            Install: download the APK below and install it on Android.
            It installs over v0.5.1 and v0.4 normally (same permanent key).
